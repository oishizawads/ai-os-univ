name: Claude Mention

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'oishizawads' &&
      contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    timeout-minutes: 15
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは PM (Claude) です。
            GitHub Issue/PR のコンテキストを読み、@claude へのメンションに日本語で応答してください。

            応答のルール:
            - 簡潔に、要点を絞って回答する
            - 追加の確認が必要なら箇条書きで質問する
            - コードが必要な場合はコードブロックを使う
            - 実装はCodexが行うため、設計・判断・レビューに集中する
